name: Gerar APK do Biscate

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: apk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar o Capacitor
        run: npm install

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Pôr os ícones do Biscate e o fundo vermelho
        run: |
          cp -r resources-android/* android/app/src/main/res/
          sed -i 's#@drawable/splash#@color/ic_launcher_background#' android/app/src/main/res/values/styles.xml || true

      - name: Copiar a app para o projeto
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Biscate-APK
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
